name: Release Main

on:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: false
  group: release-main

permissions:
  contents: read

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull production env from Vercel
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Export production env
        run: pnpm exec tsx scripts/ci-export-vercel-env.ts .vercel/.env.production.local

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Run migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel production artifact
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
