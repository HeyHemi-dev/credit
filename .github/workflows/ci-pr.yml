name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  cancel-in-progress: true
  group: pr-ci-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull shared preview env from Vercel
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Export shared preview env
        run: pnpm exec tsx scripts/ci-export-vercel-env.ts .vercel/.env.preview.local

      - name: Ensure PR Neon branch
        id: neon
        run: pnpm exec tsx scripts/ci-neon-pr-branch.ts ensure "${{ github.event.pull_request.number }}"

      - name: Sync Vercel preview database env
        run: pnpm exec tsx scripts/ci-vercel-preview-env.ts upsert "${{ github.event.pull_request.head.ref }}" "${{ steps.neon.outputs.database_url }}"

      - name: Pull branch-specific preview env from Vercel
        run: vercel pull --yes --environment=preview --git-branch="${{ github.event.pull_request.head.ref }}" --token="${VERCEL_TOKEN}"

      - name: Export branch-specific preview env
        run: pnpm exec tsx scripts/ci-export-vercel-env.ts .vercel/.env.preview.local

      - name: Export PR database URL
        run: echo "CR_DATABASE_URL=${{ steps.neon.outputs.database_url }}" >> "$GITHUB_ENV"

      - name: Run migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration
