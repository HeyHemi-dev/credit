name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  cancel-in-progress: true
  group: pr-ci-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CR_NEON_PROJECT_ID: ${{ secrets.CR_NEON_PROJECT_ID }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROD_BRANCH_ID: ${{ secrets.NEON_PROD_BRANCH_ID }}
      PROD_CR_DATABASE_URL: ${{ secrets.PROD_CR_DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure PR Neon branch
        id: neon
        run: pnpm exec tsx scripts/ci-neon-pr-branch.ts ensure "${{ github.event.pull_request.number }}"

      - name: Export PR database URL
        run: echo "CR_DATABASE_URL=${{ steps.neon.outputs.database_url }}" >> "$GITHUB_ENV"

      - name: Sync Vercel preview database env
        run: pnpm exec tsx scripts/ci-vercel-preview-env.ts upsert "${{ github.event.pull_request.head.ref }}" "${{ steps.neon.outputs.database_url }}"

      - name: Run migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration
