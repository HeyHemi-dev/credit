name: Cleanup PR DB

on:
  pull_request:
    types:
      - closed

concurrency:
  cancel-in-progress: false
  group: pr-cleanup-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull shared preview env from Vercel
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Export shared preview env
        run: pnpm exec tsx scripts/ci-export-vercel-env.ts .vercel/.env.preview.local

      - name: Remove Vercel preview database env
        run: pnpm exec tsx scripts/ci-vercel-preview-env.ts remove "${{ github.event.pull_request.head.ref }}"

      - name: Delete PR Neon branch
        run: pnpm exec tsx scripts/ci-neon-pr-branch.ts cleanup "${{ github.event.pull_request.number }}"
