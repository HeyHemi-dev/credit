name: Cleanup PR DB

on:
  pull_request:
    types:
      - closed

concurrency:
  cancel-in-progress: false
  group: pr-cleanup-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CR_NEON_PROJECT_ID: ${{ secrets.CR_NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROD_BRANCH_ID: ${{ secrets.NEON_PROD_BRANCH_ID }}
      PROD_CR_DATABASE_URL: ${{ secrets.PROD_CR_DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove Vercel preview database env
        run: pnpm exec tsx scripts/ci-vercel-preview-env.ts remove "${{ github.event.pull_request.head.ref }}"

      - name: Delete PR Neon branch
        run: pnpm exec tsx scripts/ci-neon-pr-branch.ts cleanup "${{ github.event.pull_request.number }}"
